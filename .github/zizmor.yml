# Actions are pinned to tags, not commit hashes, and Dependabot bumps them
# (.github/dependabot.yml). Hash pinning is stronger against a moved tag, but
# it costs the readability that makes a pin bump reviewable, and every action
# used here is either first-party GitHub, Astral, Determinate or PyPA.
# Revisit if a third-party action with a weaker release process is added.
rules:
  unpinned-uses:
    config:
      policies:
        "*": ref-pin
