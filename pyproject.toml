[project]
# The distribution is credmap-cli because "credmap" on PyPI is held by an
# unrelated 2022 upload. The import package and the command are both credmap.
name = "credmap-cli"
version = "0.1.4"
description = "Read-only discovery for credential stores scattered across your machine"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kai Chen" }]
keywords = ["credentials", "secrets", "cli", "discovery", "aws", "gcloud", "kubeconfig"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Utilities",
]
dependencies = ["PyYAML>=6.0"]

[project.scripts]
credmap = "credmap.cli:main"

[project.urls]
Homepage = "https://github.com/c-wenlong/credmap"
Documentation = "https://github.com/c-wenlong/credmap/tree/main/docs"
Repository = "https://github.com/c-wenlong/credmap"
Issues = "https://github.com/c-wenlong/credmap/issues"
Changelog = "https://github.com/c-wenlong/credmap/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credmap"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=6.0", "ruff>=0.16"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.coverage.run]
branch = true
source = ["credmap"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
exclude_also = [
  "if __name__ == \"__main__\":",
  "if TYPE_CHECKING:",
]
